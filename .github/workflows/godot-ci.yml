name: Godot CI

on:
  pull_request:
    branches: [dev, master]
  push:
    branches: [dev, master, 'codex/godot-ci']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: godot-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Godot validation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GODOT_VERSION: 4.7.2
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          lfs: true
          persist-credentials: false
      - name: Install official Godot
        shell: bash
        run: |
          set -euo pipefail
          asset="Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          release="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          mkdir -p "$RUNNER_TEMP/godot"
          cd "$RUNNER_TEMP/godot"
          curl --fail --location --retry 3 "$release/$asset" -o "$asset"
          curl --fail --location --retry 3 "$release/SHA512-SUMS.txt" -o SHA512-SUMS.txt
          grep -F " $asset" SHA512-SUMS.txt > selected.sha512
          sha512sum --check selected.sha512
          unzip -q "$asset"
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          chmod +x godot
          echo "$RUNNER_TEMP/godot" >> "$GITHUB_PATH"
      - name: Validate LFS, import and scene startup
        run: python3 tools/ci/validate.py --godot godot
      - name: Preserve validation logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: godot-ci-logs
          path: .ci-logs/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
